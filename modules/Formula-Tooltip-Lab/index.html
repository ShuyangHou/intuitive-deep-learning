<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX 公式拆解演示</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/module-components.css">
  <link rel="stylesheet" href="../shared/vendor/mathlive/mathlive-fonts.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="edu-root ftl-root">
    <section class="edu-shell">
      <header class="edu-header">
        <div>
          <h1 class="edu-title">训练目标如何写成公式</h1>
          <p class="edu-subtitle">用预测误差约束模型，再用正则项限制参数规模。</p>
        </div>
      </header>

      <section class="edu-stage edu-content-block edu-stage--featured" aria-labelledby="objectiveTitle">
        <header class="edu-content-head">
          <h2 class="edu-content-title" id="objectiveTitle">一个可解释的训练目标</h2>
          <p class="edu-content-subtitle">模型寻找一组权重，让预测更准确，同时避免权重无限变大。</p>
        </header>

        <div class="edu-content-body">
          <div class="ftl-formula-card">
            <div class="ftl-formula" aria-label="W star 等于对 W 求使损失函数加 lambda 乘 W 的二范数平方最小的值">
              <span class="ftl-term" tabindex="0" data-dl-explain="W*：训练结束时找到的最优权重。它是本次优化要得到的结果。" aria-label="W star，训练得到的最优权重" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="W^{*}" aria-hidden="true">W^{*}</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex="=" aria-hidden="true">=</math-field>
              <span class="ftl-term" tabindex="0" data-dl-explain="arg min：在所有候选权重 W 中，选择让整个目标函数数值最小的一组。" aria-label="arg min，对 W 寻找最小目标值" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="\underset{W}{\operatorname{arg\,min}}" aria-hidden="true">\underset{W}{\operatorname{arg\,min}}</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex="(" aria-hidden="true">(</math-field>
              <span class="ftl-term" tabindex="0" data-dl-explain="Loss：损失函数，衡量模型预测和真实答案之间相差多少。" aria-label="Loss，衡量预测误差的损失函数" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="\operatorname{Loss}" aria-hidden="true">\operatorname{Loss}</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex="(" aria-hidden="true">(</math-field>
              <span class="ftl-term" tabindex="0" data-dl-explain="y：样本的真实目标值，也就是训练数据提供的正确答案。" aria-label="y，样本真实目标值" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="y" aria-hidden="true">y</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex="," aria-hidden="true">,</math-field>
              <span class="ftl-term" tabindex="0" data-dl-explain="ŷ：模型根据当前权重 W 给出的预测值。" aria-label="y hat，模型预测值" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="\hat{y}" aria-hidden="true">\hat{y}</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex=")" aria-hidden="true">)</math-field>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex="+" aria-hidden="true">+</math-field>
              <span class="ftl-term ftl-term--warm" tabindex="0" data-dl-explain="λ：正则化强度。它决定模型在“拟合数据”和“保持权重较小”之间如何权衡。" aria-label="lambda，正则化强度" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="\lambda" aria-hidden="true">\lambda</math-field>
              </span>
              <span class="ftl-term ftl-term--warm" tabindex="0" data-dl-explain="||W||₂²：权重的 L2 正则项。较大的权重会带来更大的惩罚，帮助抑制过拟合。" aria-label="W 的 L2 范数平方，权重大小惩罚" aria-expanded="false">
                <math-field read-only virtual-keyboard-mode="manual" data-latex="\lVert W\rVert_2^2" aria-hidden="true">\lVert W\rVert_2^2</math-field>
              </span>
              <math-field class="ftl-static" read-only virtual-keyboard-mode="manual" data-latex=")" aria-hidden="true">)</math-field>
            </div>
            <p class="ftl-unavailable" data-mathlive-status hidden>MathLive 资源尚未加载，公式正以 LaTeX 源码显示。</p>
          </div>

          <div class="edu-callout edu-callout--blue">
            <strong class="edu-callout-label">优化目标</strong>
            <span class="edu-callout-text">前半部分希望模型预测得更准，后半部分希望模型不要用过大的权重硬记训练数据。</span>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="../shared/module-components.js"></script>
  <script src="../shared/mathlive-loader.js"></script>
  <script src="./script.js"></script>
</body>
</html>
